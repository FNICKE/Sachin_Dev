name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      play_bundle:
        description: 'Also build the Google Play bundle (.aab)'
        type: boolean
        default: false

permissions:
  contents: write

# Run one build at a time so two releases never overwrite each other's files.
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Fingerprint of the key that signed every APK people have installed. A different
      # key would stop them from updating, so the build refuses to use one.
      EXPECTED_SIGNING_SHA256: 'E7:3D:1A:49:34:8F:3D:CA:62:27:C0:49:FF:49:5E:63:4C:C3:00:79:29:D6:96:24:DE:FA:40:23:24:33:22:C2'
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment (needed for Android Gradle builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      # 4. Get dependencies for Flutter app
      - name: Get Dependencies
        run: flutter pub get
        working-directory: mobile_app

      # 4b. Signing key: from GitHub Secrets if they are set, otherwise the key in the
      #     repository (mobile_app/android/key.properties + app/upload-keystore.jks).
      #     Either way it must be the key that signed the installed apps.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          PROPS=mobile_app/android/key.properties
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            STORE="$RUNNER_TEMP/upload-keystore.jks"; STORE_PASS="$SECRET_STORE_PASSWORD"; ALIAS="$SECRET_KEY_ALIAS"
            echo "KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
            SOURCE="GitHub Secrets"
          elif [ -f "$PROPS" ]; then
            prop() { grep -E "^$1=" "$PROPS" | head -1 | cut -d= -f2- | tr -d '\r'; }
            STORE="mobile_app/android/app/$(prop storeFile)"; STORE_PASS="$(prop storePassword)"; ALIAS="$(prop keyAlias)"
            echo "::add-mask::$STORE_PASS"
            SOURCE="the repository (key.properties)"
          else
            echo "::error title=Signing key missing::No signing key: add mobile_app/android/key.properties + app/upload-keystore.jks, or the ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          ACTUAL=$(keytool -list -v -keystore "$STORE" -storepass "$STORE_PASS" -alias "$ALIAS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [ "$ACTUAL" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error title=Wrong signing key::This key ($ACTUAL) is not the one that signed the installed apps ($EXPECTED_SIGNING_SHA256). Apps signed with it could not update. Use the original upload-keystore.jks."
            exit 1
          fi
          echo "Signing key OK from $SOURCE ($ACTUAL)"

      # 5. Generate Version & Build Metadata
      - name: Generate Version Metadata
        id: meta
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # Every version gets its own file name, so a phone can never re-install an
          # older APK by mistake (the download is clearly "sachin-dev-v1.0.N.apk").
          APK_NAME="sachin-dev-v$VERSION.apk"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "built_at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          cat <<EOF > mobile_app/version.json
          {
            "version": "$VERSION",
            "build_number": ${{ github.run_number }},
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/mobile-latest/$APK_NAME",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "title": "Sachin Dev v$VERSION"
          }
          EOF
          echo "Generated version.json for v$VERSION (build ${{ github.run_number }})"
          cat mobile_app/version.json

      # 6. Build the Android APK with automated version & build number
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.meta.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ steps.meta.outputs.version }} \
            --dart-define=APP_BUILD=${{ github.run_number }}
        working-directory: mobile_app

      # 6b. Add the APK's checksum and size to version.json — the app checks the
      #     downloaded file against them before installing it.
      - name: Add checksum to version.json
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          jq --arg sha "$SHA" --argjson size "$SIZE" '. + {sha256: $sha, apk_size: $size}' version.json > version.tmp
          mv version.tmp version.json
          cat version.json
        working-directory: mobile_app

      # 7. Upload the compiled APK and version metadata as artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-release-apk
          path: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/version.json

      # 8. Publish the APKs FIRST. version.json is uploaded only after this succeeds,
      #    so installed apps are never told about an update whose APK isn't there yet
      #    (otherwise a phone could download the previous APK and keep seeing the pop-up).
      - name: Copy APK to its versioned name
        run: cp app-release.apk "${{ steps.meta.outputs.apk_name }}"
        working-directory: mobile_app/build/app/outputs/flutter-apk

      - name: Publish APKs to the GitHub Release
        id: publish_apk
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: mobile-latest
          name: Sachin Dev Mobile App v${{ steps.meta.outputs.version }}
          body: |
            ### 📱 Sachin Dev Mobile App — v${{ steps.meta.outputs.version }}

            - **Version**: `v${{ steps.meta.outputs.version }}`
            - **Build Number**: `${{ github.run_number }}`
            - **Built on**: ${{ steps.meta.outputs.built_at }}
            - **Commit**: `${{ github.sha }}`

            #### 📥 Direct Downloads
            - [**Download v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.apk_name }})**](https://github.com/${{ github.repository }}/releases/download/mobile-latest/${{ steps.meta.outputs.apk_name }})
            - [Always-latest link (app-release.apk)](https://github.com/${{ github.repository }}/releases/download/mobile-latest/app-release.apk)
            - [View Version Metadata (version.json)](https://github.com/${{ github.repository }}/releases/download/mobile-latest/version.json)
          files: |
            mobile_app/build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      # 9. Now that the APK is downloadable, tell installed apps about it.
      - name: Publish version.json (announces the update to installed apps)
        if: github.ref == 'refs/heads/main' && steps.publish_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload mobile-latest mobile_app/version.json --clobber --repo "${{ github.repository }}"

      # 10. Keep the release tidy: remove versioned APKs older than the previous one.
      - name: Remove old versioned APKs
        if: github.ref == 'refs/heads/main' && steps.publish_apk.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP_NOW="${{ steps.meta.outputs.apk_name }}"
          KEEP_PREV="sachin-dev-v1.0.$(( ${{ github.run_number }} - 1 )).apk"
          gh release view mobile-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name' \
            | grep -E '^sachin-dev-v[0-9.]+\.apk$' \
            | grep -vxF -e "$KEEP_NOW" -e "$KEEP_PREV" \
            | while read -r old; do
                echo "Deleting $old"
                gh release delete-asset mobile-latest "$old" --repo "${{ github.repository }}" -y
              done

      # 11. Google Play bundle — only when started from the Actions tab with
      #     "Also build the Google Play bundle" ticked. Same version number as the APK.
      #     DISTRIBUTION=play removes the self-update parts (Play doesn't allow them).
      - name: Build Google Play bundle (.aab)
        if: github.event_name == 'workflow_dispatch' && inputs.play_bundle
        env:
          DISTRIBUTION: play
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.meta.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ steps.meta.outputs.version }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=DISTRIBUTION=play
          cp build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/sachin-dev-v${{ steps.meta.outputs.version }}.aab"
        working-directory: mobile_app

      # Download it from this run's page (Artifacts) and upload it in Play Console.
      - name: Save the Google Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.play_bundle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-v${{ steps.meta.outputs.version }}
          path: mobile_app/build/app/outputs/bundle/release/sachin-dev-v${{ steps.meta.outputs.version }}.aab

      # Optional: send it straight to Play's internal testing track. Needs the secret
      # PLAY_SERVICE_ACCOUNT_JSON, and the app must already exist in Play Console
      # (the very first bundle is always uploaded by hand).
      - name: Send the bundle to Google Play (internal testing)
        if: github.event_name == 'workflow_dispatch' && inputs.play_bundle && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.sachin.app
          releaseFiles: mobile_app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
