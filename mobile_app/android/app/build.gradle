plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveKeystoreProp = { String propKey, String envKey ->
    keystoreProperties[propKey] ?: System.getenv(envKey)
}

// Release signing: key.properties (local) or env vars (CI).
//   Local: mobile_app/android/key.properties with storeFile/storePassword/keyAlias/keyPassword.
//   CI:    KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
def releaseStoreFile = resolveKeystoreProp("storeFile", "KEYSTORE_PATH")
def releaseStorePassword = resolveKeystoreProp("storePassword", "KEYSTORE_PASSWORD")
def releaseKeyAlias = resolveKeystoreProp("keyAlias", "KEY_ALIAS")
def releaseKeyPassword = resolveKeystoreProp("keyPassword", "KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "dev.sachin.app"
    // Pinned to meet Google Play's targetSdk requirement (35+ as of 2025).
    compileSdk = 35
    // Pinned: some plugins require this NDK; Flutter's default is older.
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "dev.sachin.app"
        minSdk = 21
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Otherwise the release build is unsigned and ':app:validateSigningRelease'
            // fails with a clear message — see below.
        }
    }

    // Google Play build:  DISTRIBUTION=play flutter build appbundle --dart-define=DISTRIBUTION=play
    // Play doesn't allow self-updating apps, so src/play/AndroidManifest.xml removes the
    // GitHub self-update parts. Without DISTRIBUTION=play you get the GitHub APK.
    if (System.getenv("DISTRIBUTION") == "play") {
        sourceSets.release.manifest.srcFile "src/play/AndroidManifest.xml"
    }
}

// Fail the release build with a clear message when the signing config is missing.
// Beats the opaque "SigningConfig release is missing required property storeFile".
if (!hasReleaseSigning) {
    tasks.matching { it.name.toLowerCase().contains("release") && !it.name.toLowerCase().contains("debug") }.configureEach {
        doFirst {
            if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") || it.toLowerCase().contains("bundle") }) {
                throw new GradleException(
                    "\n\nRelease signing is not configured.\n" +
                    "Local builds: create mobile_app/android/key.properties with storeFile, storePassword, keyAlias, keyPassword.\n" +
                    "CI builds:    set env vars KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.\n" +
                    "Saw: storeFile=${releaseStoreFile != null}, storePassword=${releaseStorePassword != null}, keyAlias=${releaseKeyAlias != null}, keyPassword=${releaseKeyPassword != null}.\n"
                )
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider, used by in-app updates to hand the downloaded APK to the installer.
    implementation "androidx.core:core:1.10.1"
    // Update alerts: the twice-daily background check (UpdateCheckWorker).
    implementation "androidx.work:work-runtime:2.9.1"
}
