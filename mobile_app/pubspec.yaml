name: mobile_app
description: A premium Flutter mobile app for my developer portfolio website.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  provider: ^6.1.2
  url_launcher: ^6.2.5
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  animations: ^2.0.11
  shimmer: ^3.0.0
  flex_color_scheme: ^8.0.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Bundled so text appears instantly and works offline (google_fonts finds them by file name).
    - assets/google_fonts/
